name: play-release

# Build, sign and upload the app to Play's internal testing track when a
# version tag (v*) is pushed. The "play" environment only hands out its
# secrets to v* tags. Background: adr/009 in the parent repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: play
    timeout-minutes: 90
    env:
      AAB: android/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Play rejects a versionCode it has already seen, and versionCode is
      # derived from app.json, so a tag that disagrees with app.json is a mistake.
      - name: Check the tag matches app.json
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app.json version $version"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "17"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Restore the upload key
        env:
          TRG_KEYSTORE_BASE64: ${{ secrets.TRG_KEYSTORE_BASE64 }}
        run: echo "$TRG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the AAB
        env:
          TRG_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          TRG_KEYSTORE_PASSWORD: ${{ secrets.TRG_KEYSTORE_PASSWORD }}
          TRG_KEY_ALIAS: ${{ secrets.TRG_KEY_ALIAS }}
          TRG_KEY_PASSWORD: ${{ secrets.TRG_KEY_PASSWORD }}
          # Baked into the JS bundle at build time; locally it comes from .env.
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: npm run bundle:aab

      # Same checks as App/SETUP.md "確かめること", plus the API URL, so a
      # debug-signed, arm64-only or backend-less bundle never reaches Play.
      - name: Check the AAB
        run: |
          # keytool can print the certificate and still exit non-zero (e.g. when
          # ~/.keystore is not a keystore), so judge by its output: no Owner line
          # makes the grep below fail.
          certs=$(unzip -p "$AAB" 'META-INF/*.RSA' | keytool -printcert) || true
          owner=$(printf '%s\n' "$certs" | grep -m1 'Owner:')
          echo "$owner"
          if echo "$owner" | grep -q 'CN=Android Debug'; then
            echo "::error::the AAB is signed with the debug key"
            exit 1
          fi
          abis=$(unzip -l "$AAB" | grep -oE 'lib/[a-z0-9_-]+/' | sort -u | wc -l)
          echo "ABIs: $abis"
          if [ "$abis" -ne 4 ]; then
            echo "::error::expected 4 ABIs, found $abis"
            exit 1
          fi
          # grep reads to the end (no -q), so unzip never gets SIGPIPE under pipefail.
          if ! unzip -p "$AAB" base/assets/index.android.bundle | grep -a 'execute-api' > /dev/null; then
            echo "::error::the JS bundle has no API URL (EXPO_PUBLIC_API_BASE_URL)"
            exit 1
          fi

      # Remove the key before a third-party action runs; the always() step
      # below still cleans up when an earlier step fails.
      - name: Remove the upload key
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.touringproject.app
          releaseFiles: ${{ env.AAB }}
          tracks: internal
          status: completed

      - name: Remove the upload key (cleanup)
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
